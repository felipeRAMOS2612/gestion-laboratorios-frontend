<div class="auth-container">
  <div class="auth-card">
    <h2>Inicio de Sesión</h2>
    <p class="subtitle">Gestión de Laboratorios</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" formControlName="username" placeholder="Ingrese su usuario">
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
          <small *ngIf="loginForm.get('username')?.errors?.['required']">El nombre de usuario es requerido.</small>
          <small *ngIf="loginForm.get('username')?.errors?.['minlength']">Mínimo 3 caracteres.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="********">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es requerida.</small>
          <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres.</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="global-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-primary">
        <span *ngIf="loading">Iniciando sesión...</span>
        <span *ngIf="!loading">Ingresar</span>
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/register">¿No tienes cuenta? Regístrate</a>
      <a routerLink="/auth/recover-password">Olvidé mi contraseña</a>
    </div>
  </div>
</div>
