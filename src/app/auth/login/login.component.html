<div class="auth-container">
  <div class="auth-card">
    <h2>Inicio de Sesión</h2>
    <p class="subtitle">Gestión de Laboratorios</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">El correo es requerido.</small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un correo válido.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="********">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es requerida.</small>
          <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres.</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="global-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary">Ingresar</button>
    </form>

    <div class="auth-links">
      <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
      <a routerLink="/recover-password">Olvidé mi contraseña</a>
    </div>
  </div>
</div>
