<div class="auth-container">
  <div class="auth-card">
    <h2>Recuperar Contraseña</h2>
    <p class="subtitle">Ingrese su correo para restablecer su contraseña</p>
    
    <form [formGroup]="recoverForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
        <div *ngIf="recoverForm.get('email')?.invalid && recoverForm.get('email')?.touched" class="error-message">
          <small *ngIf="recoverForm.get('email')?.errors?.['required']">El correo es requerido.</small>
          <small *ngIf="recoverForm.get('email')?.errors?.['email']">Ingrese un correo válido.</small>
        </div>
      </div>

      <div *ngIf="successMessage" class="global-success">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="global-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="recoverForm.invalid" class="btn-primary">Enviar Enlace</button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Volver al Inicio de Sesión</a>
    </div>
  </div>
</div>
