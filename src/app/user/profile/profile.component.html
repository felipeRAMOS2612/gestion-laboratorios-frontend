<div class="profile-container">
  <div class="profile-card">
    <h2>Mi Perfil</h2>
    <p class="subtitle">Actualiza tu información personal</p>
    
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="fullName">Nombre Completo</label>
        <input type="text" id="fullName" formControlName="fullName">
        <div *ngIf="profileForm.get('fullName')?.invalid && profileForm.get('fullName')?.touched" class="error-message">
          <small *ngIf="profileForm.get('fullName')?.errors?.['required']">El nombre es requerido.</small>
          <small *ngIf="profileForm.get('fullName')?.errors?.['minlength']">Mínimo 3 caracteres.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico (No editable)</label>
        <input type="email" id="email" formControlName="email" class="disabled-input">
      </div>

      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" formControlName="phone" placeholder="987654321">
        <div *ngIf="profileForm.get('phone')?.invalid && profileForm.get('phone')?.touched" class="error-message">
          <small *ngIf="profileForm.get('phone')?.errors?.['pattern']">Debe ser un número de 9 dígitos.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Dirección</label>
        <input type="text" id="address" formControlName="address" placeholder="Tu dirección">
      </div>

      <div *ngIf="successMessage" class="global-success">
        {{ successMessage }}
      </div>

      <div class="button-group">
        <button type="submit" [disabled]="profileForm.invalid" class="btn-primary">Guardar Cambios</button>
        <button type="button" routerLink="/dashboard" class="btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>
</div>
